<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Graph · __TITLE__</title>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1f2328; --muted: #6b7280; --border: #e3e3df;
  --project: #3b3b3b; --group: #8a6d3b; --idle: #4f7ccf; --running: #2e9e5b; --archived: #a3a3a3;
  --edge: #c9c9c4; --chain: #b08bd6; --fork: #d9772b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181a; --panel: #1f2124; --text: #e6e6e3; --muted: #9a9ca1; --border: #2e3034;
    --project: #d6d6d2; --group: #d1a85e; --idle: #6f9bef; --running: #49c57c; --archived: #6b6d72;
    --edge: #3c3f44; --chain: #9a78c4; --fork: #e8904a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
header h1 { font-size: 17px; margin: 0; }
header .meta { color: var(--muted); font-size: 12px; }
.controls { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; font-size: 13px; }
.controls label { cursor: pointer; user-select: none; }
main { display: grid; grid-template-columns: 1fr 360px; height: calc(100vh - 54px); min-height: 480px; }
#graph { min-height: 420px; }
aside { border-left: 1px solid var(--border); background: var(--panel); overflow: auto; padding: 16px 18px; }
aside h2 { font-size: 15px; margin: 0 0 4px; }
.kv { display: grid; grid-template-columns: 86px 1fr; gap: 4px 10px; font-size: 13px; margin: 10px 0; }
.kv div:nth-child(odd) { color: var(--muted); }
.quote { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; margin: 4px 0 10px; white-space: pre-wrap; word-break: break-word; }
.label { color: var(--muted); font-size: 12px; margin-top: 10px; }
.pill { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; color: #fff; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 14px; }
th, td { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 500; cursor: pointer; }
tr.row { cursor: pointer; } tr.row:hover, tr.sel { background: var(--bg); }
a { color: var(--idle); }
@media (max-width: 800px) {
  main { grid-template-columns: 1fr; height: auto; }
  #graph { height: 60vh; }
  aside { border-left: 0; border-top: 1px solid var(--border); }
  header { padding: 12px 16px; }
}
</style>
</head>
<body>
<header>
  <h1><span data-i="heading"></span> · <span id="proj"></span></h1>
  <span class="meta" id="meta"></span>
  <div class="controls">
    <label><input type="checkbox" id="fork" checked> <span data-i="forkToggle"></span></label>
    <label><input type="checkbox" id="chain" checked> <span data-i="chainToggle"></span></label>
    <label><input type="checkbox" id="hideArchived"> <span data-i="hideArchived"></span></label>
    <a href="#" id="lang"></a>
  </div>
</header>
<main>
  <div id="graph"></div>
  <aside>
    <div id="detail"></div>
    <table><thead><tr><th data-k="title">Session</th><th data-k="end" data-i="lastActive"></th><th data-k="context">Context</th></tr></thead><tbody id="rows"></tbody></table>
  </aside>
</main>
<script>
const DATA = __DATA__;
const I18N = {
  en: {
    heading: "Session Graph", forkToggle: "Forks", chainToggle: "Time order", hideArchived: "Hide archived",
    lastActive: "Last active", other: "中文",
    meta: (n, t) => `${n} sessions · generated ${t}`, noDesktop: " · no desktop-app data (archived state unknown)",
    pick: "Click a session to see details", running: "Running", idle: "Not running", archived: "Archived",
    dotSize: "Dot size = context used", forkLegend: "fork (original → fork)", chainLegend: "time order in group",
    group: (g, n) => `Group: ${g} (${n} sessions)`, chainTip: "Time order: earlier → later",
    forkTip: (n, p) => `Fork: shares ${n} messages, split after “${p}”`,
    summary: "One-line summary", start: "Started", end: "Last active", turns: "prompts", groupLbl: "Group",
    archivedLbl: "Archived", unknown: "unknown", yes: "yes", no: "no", source: "Source",
    openApp: "Open in the Claude app", resume: "Resume this session:", first: "First prompt", last: "Last prompt",
    forkOf: "Forked from", splitAt: p => `Split point (they diverge after): “${p}”`, shared: n => `${n} shared messages`,
    forks: n => `${n} fork${n > 1 ? "s" : ""} from here`, after: p => `after “${p}”`,
    ago: (v, u) => `${v} ${["min", "h", "d"][u]} ago`,
    offline: "Could not load vis-network (needs access to cdn.jsdelivr.net). The list on the right still works.",
  },
  zh: {
    heading: "Session 关系图", forkToggle: "fork 关系", chainToggle: "时间顺序连线", hideArchived: "隐藏已归档",
    lastActive: "最后活跃", other: "English",
    meta: (n, t) => `${n} 个 session · 生成于 ${t}`, noDesktop: " · 无 desktop 数据（归档状态未知）",
    pick: "点击一个 session 查看详情", running: "运行中", idle: "未运行", archived: "已归档",
    dotSize: "圆点大小 = context 占用", forkLegend: "fork（原始 → 分出）", chainLegend: "同组时间顺序",
    group: (g, n) => `分组：${g}（${n} 个 session）`, chainTip: "时间顺序：前一个 → 后一个",
    forkTip: (n, p) => `fork：共享 ${n} 条消息，在「${p}」之后分出`,
    summary: "一句话摘要", start: "开始", end: "最后活跃", turns: "轮提问", groupLbl: "分组",
    archivedLbl: "归档", unknown: "未知", yes: "是", no: "否", source: "来源",
    openApp: "在 Claude app 中打开", resume: "继续这个 session：", first: "第一句提问", last: "最后一句提问",
    forkOf: "fork 自", splitAt: p => `分叉点（之后各走各的）：「${p}」`, shared: n => `共享 ${n} 条消息`,
    forks: n => `从这里 fork 出 ${n} 个`, after: p => `在「${p}」之后`,
    ago: (v, u) => `${v} ${["分钟", "小时", "天"][u]}前`,
    offline: "无法加载 vis-network（需要联网访问 cdn.jsdelivr.net）。右侧列表仍可用。",
  },
};
let LANG = "__LANG__" in I18N ? "__LANG__" : "en";
try { LANG = localStorage.getItem("sg-lang") || LANG; } catch (e) {}
let T = I18N[LANG];

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmtTime = s => s ? new Date(s).toLocaleString(LANG === "zh" ? "zh-CN" : "en-US") : "—";
const fmtTok = n => !n ? "—" : n >= 1000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1) + "k" : String(n);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago = s => { if (!s) return ""; const m = (Date.now() - new Date(s)) / 60000;
  return m < 60 ? T.ago(Math.round(m), 0) : m < 1440 ? T.ago(Math.round(m / 60), 1) : T.ago(Math.round(m / 1440), 2); };
const color = s => s.archived ? css("--archived") : s.running ? css("--running") : css("--idle");
const byId = Object.fromEntries(DATA.sessions.map(s => [s.id, s]));

let network, sortKey = "start", sortDir = 1, selected = null;

function legend() {
  return `<h2>${T.pick}</h2><div class="legend">
    <span><span class="dot" style="background:var(--running)"></span>${T.running}</span>
    <span><span class="dot" style="background:var(--idle)"></span>${T.idle}</span>
    <span><span class="dot" style="background:var(--archived)"></span>${T.archived}</span>
    <span>${T.dotSize}</span>
    <span><span style="color:var(--fork)">━▶</span> ${T.forkLegend}</span>
    <span><span style="color:var(--chain)">┅▶</span> ${T.chainLegend}</span></div>`;
}

function applyLang() {
  T = I18N[LANG];
  document.documentElement.lang = LANG === "zh" ? "zh" : "en";
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = T[el.dataset.i]);
  document.getElementById("lang").textContent = T.other;
  document.getElementById("proj").textContent = DATA.project;
  document.getElementById("meta").textContent =
    T.meta(DATA.sessions.length, fmtTime(DATA.generatedAt)) + (DATA.desktopMetadata ? "" : T.noDesktop);
  if (selected) show(selected); else document.getElementById("detail").innerHTML = legend();
}

function build() {
  const hideArch = document.getElementById("hideArchived").checked;
  const chain = document.getElementById("chain").checked;
  const fork = document.getElementById("fork").checked;
  const list = DATA.sessions.filter(s => !(hideArch && s.archived));
  renderRows(list);
  if (!window.vis) {
    document.getElementById("graph").innerHTML = `<p style="padding:20px">${T.offline}</p>`;
    return;
  }
  const maxCtx = Math.max(1, ...list.map(s => s.context || 0));
  const nodes = [{ id: "__project", label: DATA.project.split(/[\\/]/).filter(Boolean).pop() || DATA.project, shape: "box",
    color: { background: css("--project"), border: css("--project") }, font: { color: css("--bg"), size: 15 }, margin: 10 }];
  const edges = [];
  const groups = {};
  list.forEach(s => (groups[s.group] = groups[s.group] || []).push(s));
  Object.entries(groups).forEach(([g, ss]) => {
    const gid = "__g:" + g;
    const [br, loc] = g.split(" @ ");
    const short = loc ? `${br}\n📁 ${loc.split(/[\\/]/).filter(Boolean).slice(-1)[0]}` : br;
    nodes.push({ id: gid, label: short, shape: "box", color: { background: css("--panel"), border: css("--group") },
      font: { color: css("--group") }, borderWidth: 2, widthConstraint: { maximum: 200 }, title: T.group(g, ss.length) });
    edges.push({ from: "__project", to: gid, color: css("--edge"), width: 2 });
    ss.sort((a, b) => a.start.localeCompare(b.start));
    ss.forEach((s, i) => {
      nodes.push({ id: s.id, label: s.title.length > 32 ? s.title.slice(0, 31) + "…" : s.title, shape: "dot",
        size: 10 + 22 * Math.sqrt((s.context || 0) / maxCtx), color: { background: color(s), border: color(s) },
        font: { color: css("--text"), size: 13 }, title: s.summary });
      edges.push({ from: gid, to: s.id, color: css("--edge") });
      const forkPair = fork && (s.forkOf === ss[i - 1]?.id || ss[i - 1]?.forkOf === s.id);
      if (chain && i > 0 && !forkPair) edges.push({ from: ss[i - 1].id, to: s.id, arrows: "to", dashes: true,
        color: css("--chain"), title: T.chainTip, smooth: { type: "curvedCW", roundness: 0.25 } });
    });
  });
  const shown = new Set(list.map(s => s.id));
  if (fork) list.forEach(s => {
    if (!s.forkOf || !shown.has(s.forkOf)) return;
    edges.push({ from: s.forkOf, to: s.id, arrows: "to", width: 2.5, color: css("--fork"),
      label: "fork", font: { color: css("--fork"), size: 11, strokeWidth: 3, strokeColor: css("--bg") },
      title: T.forkTip(s.forkShared, s.forkPoint || "?"), smooth: { type: "curvedCCW", roundness: 0.2 } });
  });
  if (network) network.destroy();
  network = new vis.Network(document.getElementById("graph"), { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) }, {
    physics: { solver: "forceAtlas2Based", stabilization: { iterations: 200 } },
    interaction: { hover: true, tooltipDelay: 150 }, edges: { width: 1.2 } });
  network.on("click", p => { const id = p.nodes[0]; if (id && byId[id]) show(id); });
  if (selected && byId[selected]) network.selectNodes([selected]);
}

function show(id) {
  selected = id;
  const s = byId[id];
  const status = s.archived ? [T.archived, "--archived"] : s.running ? [T.running + (s.status ? ` (${s.status})` : ""), "--running"] : [T.idle, "--idle"];
  document.getElementById("detail").innerHTML = `
    <h2>${esc(s.title)}</h2>
    <span class="pill" style="background:var(${status[1]})">${status[0]}</span>
    <div class="label">${T.summary}</div><div class="quote">${esc(s.summary)}</div>
    ${forkInfo(s)}
    <div class="kv">
      <div>${T.start}</div><div>${fmtTime(s.start)}</div>
      <div>${T.end}</div><div>${fmtTime(s.end)} (${ago(s.end)})</div>
      <div>Context</div><div>${fmtTok(s.context)} tokens · ${s.userTurns} ${T.turns}</div>
      <div>${T.groupLbl}</div><div>${esc(s.group)}</div>
      <div>${T.archivedLbl}</div><div>${s.archived === null ? T.unknown : s.archived ? T.yes : T.no}</div>
      <div>${T.source}</div><div>${esc(s.entrypoint || "—")}${s.model ? " · " + esc(s.model) : ""}</div>
      <div>ID</div><div style="word-break:break-all">${esc(s.id)}</div>
    </div>
    ${s.link ? `<a href="${esc(s.link)}">${T.openApp}</a>` : `<div class="label">${T.resume}</div><div class="quote">claude --resume ${esc(s.id)}</div>`}
    <div class="label">${T.first}</div><div class="quote">${esc(s.firstPrompt || "—")}</div>
    <div class="label">${T.last}</div><div class="quote">${esc(s.lastPrompt || "—")}</div>`;
  document.querySelectorAll("tr.row").forEach(r => r.classList.toggle("sel", r.dataset.id === id));
  network && network.selectNodes([id]);
}

function forkInfo(s) {
  const link = id => byId[id] ? `<a href="#" data-go="${esc(id)}">${esc(byId[id].title)}</a>` : esc(id);
  const kids = DATA.sessions.filter(x => x.forkOf === s.id);
  let h = "";
  if (s.forkOf) h += `<div class="label">${T.forkOf}</div><div class="quote">${link(s.forkOf)}<br>${esc(T.splitAt(s.forkPoint || "?"))}<br>${T.shared(s.forkShared)}${s.forkAt ? " · " + fmtTime(s.forkAt) : ""}</div>`;
  if (kids.length) h += `<div class="label">${T.forks(kids.length)}</div><div class="quote">${kids.map(k => "• " + link(k.id) + (k.forkPoint ? `<br>&nbsp;&nbsp;${esc(T.after(k.forkPoint.slice(0, 50)))}` : "")).join("<br>")}</div>`;
  return h;
}
document.getElementById("detail").addEventListener("click", e => {
  const id = e.target.dataset && e.target.dataset.go;
  if (id) { e.preventDefault(); show(id); network && network.focus(id, { scale: 1.1, animation: true }); }
});

function renderRows(list) {
  const rows = [...list].sort((a, b) => {
    const x = a[sortKey] ?? "", y = b[sortKey] ?? "";
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * sortDir;
  });
  document.getElementById("rows").innerHTML = rows.map(s => `
    <tr class="row${s.id === selected ? " sel" : ""}" data-id="${esc(s.id)}">
      <td><span class="dot" style="background:${color(s)}"></span>${esc(s.title)}</td>
      <td>${ago(s.end)}</td><td>${fmtTok(s.context)}</td></tr>`).join("");
  document.querySelectorAll("tr.row").forEach(r => r.onclick = () => {
    show(r.dataset.id); network && network.focus(r.dataset.id, { scale: 1.1, animation: true }); });
}
const visible = () => DATA.sessions.filter(s => !(document.getElementById("hideArchived").checked && s.archived));
document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
  const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : (k === "title" ? 1 : -1); sortKey = k;
  renderRows(visible());
});
document.getElementById("lang").onclick = e => {
  e.preventDefault(); LANG = LANG === "en" ? "zh" : "en";
  try { localStorage.setItem("sg-lang", LANG); } catch (err) {}
  applyLang(); build();
};
["chain", "fork", "hideArchived"].forEach(id => document.getElementById(id).onchange = build);
applyLang();
build();
</script>
</body>
</html>
